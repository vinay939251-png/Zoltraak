version: '3.8'

services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zoltraak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zoltraak_collections
      POSTGRES_USER: zoltraak_user
      POSTGRES_PASSWORD: zoltraak_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoltraak_user -d zoltraak_collections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (In-Memory Cache & Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: zoltraak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Apache Kafka (KRaft mode event broker)
  kafka:
    image: bitnami/kafka:3.7
    container_name: zoltraak-kafka
    restart: unless-stopped
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafkadata:/bitnami/kafka

  # 4. Apache Spark (Master Node)
  spark-master:
    image: bitnami/spark:3.5
    container_name: zoltraak-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"

  # 5. Apache Spark (Worker Node)
  spark-worker:
    image: bitnami/spark:3.5
    container_name: zoltraak-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master

  # 6. Django REST Application Server
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: zoltraak-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://zoltraak_user:zoltraak_secure_password_2026@postgres:5432/zoltraak_collections
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 7. Celery Asynchronous Background Worker
  celery-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: zoltraak-celery-worker
    command: celery -A config worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://zoltraak_user:zoltraak_secure_password_2026@postgres:5432/zoltraak_collections
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
