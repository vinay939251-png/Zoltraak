# Optional infrastructure profile. The basic local demo does not require Docker.
# Start only after reviewing resource, data-retention, and credential requirements.
services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [production-adapters]
    environment:
      POSTGRES_DB: collections
      POSTGRES_USER: collections
      POSTGRES_PASSWORD: change-me-local-only
    ports: ['5432:5432']
    volumes: [collections_pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    profiles: [production-adapters]
    ports: ['6379:6379']
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [streaming-adapter]
    command: redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false
    ports: ['9092:9092']
volumes:
  collections_pgdata:
